<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ขายสินค้า — Pixel CardShop POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <div class="main-header">
    <img src="https://img2.pic.in.th/639920409_122130376431132753_2338159124093452873_n.jpg" alt="Logo" class="store-logo">
    <h1 class="store-name">Pixel CardShop POS</h1>
    <nav class="main-nav">
      <a href="pos.html" class="nav-link active">🛒 ขายสินค้า</a>
      <a href="products.html" class="nav-link">📦 จัดการสินค้า</a>
      <a href="reports.html" class="nav-link">📊 รายงาน</a>
    </nav>
    <span id="staff-name" class="staff-name">พนักงาน: -</span>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>

  <div id="pos-screen">
    <div class="left-panel">
      <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 10px;">
        <h2 style="margin: 0; min-width: 140px;">🛒 รายการสินค้า</h2>
        
        <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
          <button class="btn" style="background: #f1c40f; color: #2c3e50; width: auto; padding: 8px 12px; font-size: 14px;" onclick="openMemberMenu()">👑 ระบบสมาชิก</button>
        </div>
      </div>
      <div id="category-filter"></div>
      <div class="search-bar" style="margin-bottom: 15px; display: flex; gap: 10px;">
    <input type="text" id="barcodeInput" placeholder="🔍 ยิงบาร์โค้ด หรือพิมพ์เลขแล้วกด Enter..." style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Kanit'; font-size: 16px; background-color: #fffbdd;">
</div>
      <div class="product-grid" id="product-list">
        <h3 style="color: #7f8c8d; text-align: center; width: 100%; margin-top: 40px;">กำลังโหลดข้อมูล...</h3>
      </div>
    </div>

    <div class="right-panel">
      <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px;">📋 บิลปัจจุบัน</h3>
      <div id="cart-list" style="min-height: 120px; max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
      <h2 style="text-align: right; color: #e74c3c; border-top: 2px dashed #ddd; padding-top: 15px; font-size: 28px;">
        ยอดรวม: <span id="total-price">0</span> ฿
      </h2>
      <div id="discountRow" style="display: none; color: #e74c3c; font-weight: bold; font-size: 16px; margin-bottom: 10px; text-align: right;">
        💎 ส่วนลดสมาชิก (Grade <span id="showGrade">0</span>): <span id="discountAmount">0</span> บาท
      </div>

      <div id="activeMemberBox" style="display: none; background: #fff8e1; border: 1px solid #f1c40f; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                  <span style="font-size: 13px; color: #7f8c8d;">ลูกค้ารับส่วนลดบิลนี้:</span><br>
                  <strong style="color: #2c3e50; font-size: 16px;">👑 <span id="activeMName">-</span> (Grade <span id="activeMGrade">0</span>)</strong><br>
                  <span style="font-size: 13px; color: #e67e22; font-weight: bold;">⭐ แต้มคงเหลือ: <span id="activeMPoints">0</span> แต้ม</span>
                  
                  <div style="margin-top: 8px;">
                      <button onclick="openRedeemMenu()" style="background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-size: 13px; font-weight: bold;">🎁 แลกของรางวัล</button>
                  </div>
              </div>
              <button onclick="clearMember()" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-size: 13px;">เอาออก ✖</button>
          </div>
      </div>

      <div class="section-box">
        <h4>🃏 ขายการ์ดแยกใบ (Single)</h4>
        <input type="text" id="single-name" placeholder="ชื่อการ์ด (ใส่หรือไม่ใส่ก็ได้)">
        <input type="number" id="single-price" placeholder="ราคา (บาท)">
        <button class="btn" style="background: #8e44ad;" onclick="addSingle()">+ เพิ่มการ์ดลงบิล</button>
      </div>

      <div class="section-box">
        <h4>🎲 คิดค่าห้องเกม </h4>
        <div style="display: flex; gap: 5px;">
          <input type="number" id="room-people" placeholder="จำนวนคน" min="1" style="width: 45%;">
          <input type="number" id="room-hours" placeholder="จำนวนชั่วโมง" step="0.5" min="0.5" style="width: 45%;">
        </div>
        <button class="btn" style="background: #2980b9;" onclick="addRoom()">+ เพิ่มค่าห้องลงบิล</button>
      </div>

      <div class="section-box" style="background: #fff8e1; border-color: #ffecb3;">
        <input type="text" id="order-remark" placeholder="หมายเหตุ (เช่น หวานน้อย)">
        <button class="btn btn-checkout" onclick="openCheckout()">💳 ชำระเงิน / พักบิล</button>
        <button class="btn" style="background: #e67e22; margin-top: 10px; font-size: 16px; position: relative;" onclick="showOpenTabs()">
          🛎️ เรียกบิลที่พักไว้ (Load Tab)
          <span id="tab-count-badge" style="display: none; position: absolute; top: -8px; right: -8px; background: #c0392b; color: white; border-radius: 50%; padding: 4px 10px; font-size: 14px; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">0</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const currentStaff = requireAuth();
  let cart = [];
  let allProducts = [];
  let currentCategory = "ทั้งหมด";
  let currentMember = null; // ตัวแปรเก็บข้อมูลสมาชิก

  function loadProducts() {
    api.getProducts().then(function(products) {
      allProducts = products;
      renderCategories(); 
      renderProducts(currentCategory); 
    });
  }

  function renderCategories() {
    let categories = ["ทั้งหมด"];
    allProducts.forEach(p => { 
      if (p.category && !categories.includes(p.category)) {
        categories.push(p.category); 
      }
    });
    
    let html = "";
    categories.forEach(cat => {
      let activeClass = (cat === currentCategory) ? "active" : "";
      html += `<button class="cat-btn ${activeClass}" onclick="filterProducts('${cat}')">${cat}</button>`;
    });
    document.getElementById("category-filter").innerHTML = html;
  }

  function filterProducts(category) {
    currentCategory = category;
    renderCategories(); 
    renderProducts(category); 
  }

  function renderProducts(category) {
    let html = ""; 
    let count = 0;
    
    allProducts.forEach((p, index) => {
      if ((category === "ทั้งหมด" || p.category === category) && p.status !== "ปิด") {
        count++;
        let imgUrl = p.image ? p.image : "https://via.placeholder.com/150/f4f6f9/95a5a6?text=" + encodeURIComponent(p.name);
        
        let stockHtml = "";
        let isOutOfStock = false;
        
        if (p.stock === "") {
          stockHtml = `<span class="stock-badge unlimited">∞ ไม่จำกัด</span>`;
        } else if (p.stock > 0) {
          stockHtml = `<span class="stock-badge ok">เหลือ: ${p.stock}</span>`;
        } else {
          stockHtml = `<span class="stock-badge">หมด!</span>`;
          isOutOfStock = true;
        }
        
        let cardStyle = isOutOfStock ? "opacity: 0.5; cursor: not-allowed;" : "";

        html += `
          <div class="product-card" onclick="addToCart(${index}, ${isOutOfStock})" style="${cardStyle}">
            ${stockHtml}
            <img src="${imgUrl}" alt="${p.name}">
            <div style="font-size: 13px; margin-top: 8px; font-weight: bold; height: 35px; overflow: hidden; color: #34495e;">${p.name}</div>
            <div style="color: #27ae60; font-weight: bold; font-size: 15px;">${p.price} ฿</div>
          </div>`;
      }
    });
    
    if (count === 0) {
      html = `<h3 style="color: #7f8c8d; text-align: center; width: 100%; margin-top: 40px;">ไม่มีสินค้าพร้อมขาย</h3>`;
    }
    document.getElementById("product-list").innerHTML = html;
  }

  // --- ตะกร้า และ เพิ่มรายการ ---
  function addToCart(index, isOutOfStock) {
    if (isOutOfStock) return Swal.fire('ขออภัย', 'สินค้านี้สต๊อกหมดแล้ว', 'warning');
    
    let product = allProducts[index];
    let existingItem = cart.find(item => item.name === product.name);
    
    if (existingItem) {
      if (product.stock !== "" && existingItem.qty >= product.stock) {
        return Swal.fire('สต๊อกไม่พอ', `สินค้านี้มีจำกัดแค่ ${product.stock} ชิ้น`, 'warning');
      }
      existingItem.qty += 1; 
      existingItem.price += product.price; 
    } else {
     cart.push({ name: product.name, price: product.price, unitPrice: product.price, qty: 1, category: product.category });
    }
    updateCart();
  }

// คำนวณส่วนลดตาม Grade สมาชิก
function calculateMemberDiscount(cartItems) {
    let totalDiscount = 0;
    if (!currentMember || currentMember.grade < 2) return 0;
    let grade = currentMember.grade;

    for (let i = 0; i < cartItems.length; i++) {
        let item = cartItems[i];
        // item.price คือราคารวมของบรรทัดนี้อยู่แล้ว (สะสมตาม qty มาจาก addToCart)
        // ห้ามคูณ item.qty ซ้ำอีก ไม่งั้นซื้อ 2 ชิ้นจะโดนลด 2 เท่า, 3 ชิ้นลด 3 เท่า ผิดเพี้ยนไปเรื่อยๆ
        let itemTotal = item.price;
        
        let isFoodOrDrink = (item.category === "อาหาร" || item.category === "เครื่องดื่ม" || item.category === "ท็อปปิ้ง");
        let isBox = (item.category === "Box" || item.category === "แวนการ์ดยกกล่อง");

        if (grade === 2) {
            if (isFoodOrDrink) totalDiscount += itemTotal * 0.05;
        } 
        else if (grade === 3) {
            if (isBox) totalDiscount += itemTotal * 0.10;
            else totalDiscount += itemTotal * 0.05;
        } 
        else if (grade === 4) {
            totalDiscount += itemTotal * 0.10;
        }
    }
    return Math.floor(totalDiscount); 
}

// อัปเดตตะกร้า (ใช้ฟังก์ชันนี้ตัวเดียวเท่านั้น)
function updateCart() {
    if (cart.length === 0) {
      document.getElementById("cart-list").innerHTML = '<div style="text-align:center; color: #aaa; margin-top: 30px;">ยังไม่มีสินค้าในตะกร้า</div>';
      document.getElementById("total-price").innerText = "0"; 
      document.getElementById("discountRow").style.display = "none";
      return;
    }
    
    let html = ""; 
    let subTotal = 0; 

    cart.forEach((item, i) => {
      let qtyDisplay = item.qty > 1 ? `<span style="color:#e67e22; font-size: 14px; font-weight: bold;">(x${item.qty})</span>` : '';
      html += `<div class="cart-item">
                 <span style="color: #2c3e50; font-weight: 500;">${item.name} ${qtyDisplay}</span>
                 <span style="font-weight: bold; color: #e74c3c;">${item.price} ฿ 
                   <button onclick="removeItem(${i})" style="color:#aaa; background:none; border:none; cursor:pointer; font-size:16px;">✖</button>
                 </span>
               </div>`;
      subTotal += item.price;
    });
    
    // คำนวณและหักส่วนลด
    let discount = calculateMemberDiscount(cart);
    let netTotal = subTotal - discount;

    document.getElementById("cart-list").innerHTML = html;
    document.getElementById("total-price").innerText = netTotal; 

    if (discount > 0 && currentMember) {
        document.getElementById("discountRow").style.display = "block";
        document.getElementById("showGrade").innerText = currentMember.grade;
        document.getElementById("discountAmount").innerText = "-" + discount;
    } else {
        document.getElementById("discountRow").style.display = "none";
    }
}

  function removeItem(index) { 
    cart.splice(index, 1); 
    updateCart(); 
  }

  function addSingle() {
    let name = document.getElementById("single-name").value || "การ์ดแยกใบ (Single)";
    let price = parseFloat(document.getElementById("single-price").value);
    if (isNaN(price) || price <= 0) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาใส่ราคาการ์ดให้ถูกต้อง', 'warning');
    
    let existingItem = cart.find(item => item.name === name && item.unitPrice === price);
    if (existingItem) {
      existingItem.qty += 1;
      existingItem.price += price;
    } else {
      cart.push({ name: name, price: price, unitPrice: price, qty: 1, category: "Single" });
    }
    
    document.getElementById("single-name").value = ""; 
    document.getElementById("single-price").value = "";
    updateCart();
  }

  function addRoom() {
    let people = parseInt(document.getElementById("room-people").value);
    let hours = parseFloat(document.getElementById("room-hours").value);
    if (isNaN(people) || isNaN(hours) || people <= 0 || hours <= 0) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกจำนวนคน/ชั่วโมงให้ถูกต้อง', 'warning');
    
    let rate = 40;
    if (people === 1) rate = 70;
    else if (people === 2) rate = 60;
    else if (people === 3) rate = 50;
    
    let totalPrice = (rate * people) * hours;
    let roomName = `ห้องเกม (${people}คน/${hours}ชม.)`;
    
    let existingItem = cart.find(item => item.name === roomName);
    if (existingItem) {
      existingItem.qty += 1;
      existingItem.price += totalPrice;
    } else {
      cart.push({ name: roomName, price: totalPrice, unitPrice: totalPrice, qty: 1, category: "Room" });
    }

    document.getElementById("room-people").value = ""; 
    document.getElementById("room-hours").value = "";
    updateCart();
  }

// --- ชำระเงิน / พักบิล / เรียกบิล ---
function openCheckout() {
    if (cart.length === 0) {
      return Swal.fire('ตะกร้าว่างเปล่า', 'กรุณาเลือกสินค้าก่อนคิดเงิน', 'warning');
    }
    
    let total = parseFloat(document.getElementById("total-price").innerText);
    let remark = document.getElementById("order-remark").value;

    Swal.fire({
      title: '💳 ชำระเงิน',
      html: `
        <h2 style="color: #2c3e50; margin-top: 0; font-size: 20px;">ยอดรวมเดิม: <span id="checkout-original-total" style="text-decoration: line-through; color: #7f8c8d;">${total}</span> บาท</h2>
        
        <div style="text-align: left; margin-top: 10px; background: #fff3cd; padding: 12px; border-radius: 8px; border: 1px dashed #f1c40f;">
          <label style="font-weight: bold; color: #d35400;">🏷️ ส่วนลดเพิ่มเติม/ลดท้ายบิล (บาท):</label>
          <input type="number" id="manual-discount" class="swal2-input" style="margin-top: 5px; margin-bottom: 5px; width: 90%; border-color: #f1c40f;" value="0" onkeyup="calculateChange(${total})" onchange="calculateChange(${total})" onClick="this.select();">
        </div>

        <h2 style="color: #e74c3c; margin-top: 15px; border-top: 2px dashed #ddd; padding-top: 15px; font-size: 28px;">ยอดสุทธิ: <span id="checkout-net-total">${total}</span> ฿</h2>
        
        <div style="text-align: left; margin-top: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px;">
          <label style="font-weight: bold; color: #2ecc71;">💵 รับเงินสด (บาท):</label>
          <input type="number" id="pay-cash" class="swal2-input" style="margin-top: 5px; margin-bottom: 15px; width: 90%;" value="${total}" onkeyup="calculateChange(${total})" onchange="calculateChange(${total})" onClick="this.select();">
          <label style="font-weight: bold; color: #3498db;">📱 เงินโอน (บาท):</label>
          <input type="number" id="pay-transfer" class="swal2-input" style="margin-top: 5px; width: 90%;" value="0" onkeyup="calculateChange(${total})" onchange="calculateChange(${total})" onClick="this.select();">
          <h3 id="change-display" style="color: #27ae60; text-align: center; margin-top: 20px;">เงินทอน: 0 บาท</h3>
        </div>`,
      showCancelButton: true, 
      showDenyButton: true, 
      confirmButtonText: '✅ ยืนยันชำระเงิน', 
      denyButtonText: '⏳ พักบิล (เปิดโต๊ะ)', 
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#28a745', 
      denyButtonColor: '#f39c12', 
      width: '500px',
      didOpen: () => {
         calculateChange(total);
      },
      preConfirm: () => {
        let manualDiscount = parseFloat(document.getElementById('manual-discount').value) || 0;
        let netTotal = total - manualDiscount;
        if (netTotal < 0) netTotal = 0; 

        let cashReceived = parseFloat(document.getElementById('pay-cash').value) || 0;
        let transfer = parseFloat(document.getElementById('pay-transfer').value) || 0;
        
        if (cashReceived + transfer < netTotal) { 
          Swal.showValidationMessage('เงินไม่ครบ! ขาด ' + (netTotal - (cashReceived + transfer)) + ' บาท'); 
          return false; 
        }
        
        let changeAmount = (cashReceived + transfer) - netTotal;
        let actualCash = netTotal - transfer; 
        if (actualCash < 0) actualCash = 0; 
        
        let finalRemark = remark;
        if (manualDiscount > 0) {
            finalRemark += (finalRemark ? " | " : "") + "ลดท้ายบิล: " + manualDiscount + " บาท";
        }

        return { actualCash: actualCash, transfer: transfer, cashReceived: cashReceived, changeAmount: changeAmount, netTotal: netTotal, finalRemark: finalRemark };
      }
    }).then((result) => {
      if (result.isConfirmed) {
        let phone = currentMember ? currentMember.phone : ""; 
        processPayment(result.value.actualCash, result.value.transfer, result.value.netTotal, result.value.finalRemark, result.value.cashReceived, result.value.changeAmount, phone);
      } else if (result.isDenied) {
        processSaveTab(remark);
      }
    });
}

function calculateChange(originalTotal) {
    let manualDiscount = parseFloat(document.getElementById('manual-discount').value) || 0;
    let netTotal = originalTotal - manualDiscount;
    if (netTotal < 0) netTotal = 0;

    document.getElementById('checkout-net-total').innerText = netTotal;

    let cash = parseFloat(document.getElementById('pay-cash').value) || 0;
    let transfer = parseFloat(document.getElementById('pay-transfer').value) || 0;
    let change = (cash + transfer) - netTotal;
    let display = document.getElementById('change-display');
    
    if (change < 0) {
      display.innerHTML = `<span style="color: #e74c3c;">ขาดเงินอีก: ${Math.abs(change)} บาท</span>`;
    } else {
      display.innerHTML = `<span style="color: #27ae60;">เงินทอน: ${change} บาท</span>`;
    }
}

function processPayment(cash, transfer, total, remark, cashReceived, changeAmount, memberPhone) {
    Swal.fire({ title: 'กำลังบันทึกและตัดสต๊อก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    let empInfo = currentStaff.name + " (" + currentStaff.empId + ")"; 
    
    api.saveTransaction(JSON.stringify(cart), total, cash, transfer, empInfo, remark, cashReceived, changeAmount, memberPhone).then(function(res) {
      if (res.success) {
        // 1. เรียกใช้งาน Popup ใบเสร็จแทนการแจ้งเตือนแบบเดิม!
        showReceiptPopup(res.orderId, cart, total, cashReceived, changeAmount);
        
        // 2. เคลียร์ตะกร้าและอัปเดตข้อมูลหน้าจอ
        cart = []; 
        document.getElementById('order-remark').value = ""; 
        clearMember(); 
        updateCart();
        loadProducts(); 
      } else {
        Swal.fire('ผิดพลาด', res.message, 'error');
      }
    });
  }

// ==========================================
// 🖨️ ระบบสร้างและพิมพ์ใบเสร็จ (Popup หลังจ่ายเงิน)
// ==========================================
function showReceiptPopup(orderId, cart, total, cashReceived, changeAmount) {
    // 1. จัดหน้าตาใบเสร็จ (สลิป 80mm หรือ 58mm)
    let receiptHTML = `
        <div id="printSection" style="text-align: left; font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #000; padding: 10px;">
            <h3 style="text-align:center; margin: 0 0 10px 0;">Pixel CardShop</h3>
            <p style="margin: 0; font-size: 12px;">เลขบิล: ${orderId}</p>
            <p style="margin: 0; font-size: 12px;">วันที่: ${new Date().toLocaleString('th-TH')}</p>
            <hr style="border-top: 1px dashed #000; margin: 10px 0;">
            <table style="width: 100%; font-size: 12px;">`;
            
    cart.forEach(item => {
        receiptHTML += `<tr>
            <td style="padding: 2px 0;">${item.name} x${item.qty}</td>
            <td style="text-align: right; padding: 2px 0;">${(item.price * item.qty).toLocaleString()}</td>
        </tr>`;
    });

    receiptHTML += `
            </table>
            <hr style="border-top: 1px dashed #000; margin: 10px 0;">
            <table style="width: 100%; font-size: 12px; font-weight: bold;">
                <tr><td>ยอดรวมทั้งสิ้น</td><td style="text-align: right;">${total.toLocaleString()} บาท</td></tr>
                <tr><td>รับเงินมา</td><td style="text-align: right;">${cashReceived.toLocaleString()} บาท</td></tr>
                <tr><td>เงินทอน</td><td style="text-align: right;">${changeAmount.toLocaleString()} บาท</td></tr>
            </table>
            <p style="text-align:center; margin-top: 15px; font-size: 12px;">ขอบคุณที่ใช้บริการครับ!</p>
        </div>
    `;

    // 2. เรียกหน้าต่าง Popup ของ SweetAlert
    Swal.fire({
        title: '✅ ชำระเงินสำเร็จ!',
        html: receiptHTML,
        width: 400,
        showCancelButton: true,
        showDenyButton: true,
        confirmButtonText: '🖨️ พิมพ์บิล',
        denyButtonText: '❌ ไม่พิมพ์',
        cancelButtonText: 'ปิด',
        confirmButtonColor: '#28a745',
        denyButtonColor: '#e74c3c',
        cancelButtonColor: '#6c757d',
        allowOutsideClick: false
    }).then((result) => {
        if (result.isConfirmed) {
            // สั่งพิมพ์บิล
            printReceipt(receiptHTML);
        }
        // ไม่ว่าจะพิมพ์ หรือไม่พิมพ์ หรือกดปิด ก็ทำการล้างตะกร้าเพื่อรับลูกค้าคนต่อไป
    });
}

// ฟังก์ชันสั่งหน้าต่างพิมพ์ (เปิดหน้าต่างใหม่ชั่วคราวเพื่อพิมพ์)
function printReceipt(content) {
    let printWindow = window.open('', '', 'width=300,height=500');
    printWindow.document.write('<html><head><title>Print Receipt</title>');
    printWindow.document.write('</head><body style="margin:0;">');
    printWindow.document.write(content);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.focus();
    
    // หน่วงเวลาเล็กน้อยให้หน้าเว็บเรนเดอร์เสร็จแล้วค่อยเด้งหน้าต่างปริ้น
    setTimeout(() => {
        printWindow.print();
        printWindow.close();
    }, 500);
}

let d = new Date();

let currentMonth = thaiTime.toISOString().slice(0, 7);

                <div style="display: flex; flex-direction: column; gap: 10px;">

                    <button class="btn" style="background: #3498db; text-align: left;" onclick="promptCustomRedeem(20, 'เซตคอมโบ (เครื่องดื่ม+ของทอด)')">⭐ 20 แต้ม ➡️ เซตคอมโบ</button>

            </div>

        showCloseButton: true

function promptCustomRedeem(pointsDeduct, defaultRewardName) {
    let pts = parseInt(currentMember.points) || 0;
    
    // เช็คแต้มก่อน ถ้าแต้มไม่พอให้แจ้งเตือนทันที
    if (pts < pointsDeduct) {
        return Swal.fire('แต้มไม่พอ!', `คุณมี ${pts} แต้ม (ขาดอีก ${pointsDeduct - pts} แต้ม)`, 'warning');
    }

    Swal.fire({
        title: '✏️ ระบุของรางวัลที่ต้องการแลก',
        html: `
            <div style="font-family: 'Kanit'; text-align: left;">
                <p style="text-align:center;">ใช้แต้ม: <b style="color:#e67e22; font-size:18px;">${pointsDeduct} แต้ม</b></p>
                <label style="font-size: 14px; font-weight: bold; color: #2c3e50;">ชื่อของรางวัล (พิมพ์แก้ไขได้ตามใจชอบ):</label>
                <input type="text" id="custom-reward-name" class="swal2-input" style="width: 85%; margin-top: 10px;" value="${defaultRewardName}" onClick="this.select();">
            </div>
        `,
        showCancelButton: true,
        confirmButtonText: '✅ ถัดไป',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#3498db',
        preConfirm: () => {
            let rewardName = document.getElementById('custom-reward-name').value.trim();
            if (!rewardName) Swal.showValidationMessage('กรุณาระบุชื่อของรางวัลให้ชัดเจนครับ');
            return rewardName;
        }
    }).then((result) => {
        if (result.isConfirmed) confirmRedeem(pointsDeduct, result.value);
    });
}

// ----------------------------------------------------
// ยืนยันการตัดแต้มและเอาของรางวัลลงบิล
// ----------------------------------------------------
function confirmRedeem(pointsDeduct, customRewardName) {
    Swal.fire({
        title: 'ยืนยันการแลกรางวัล?',
        html: `ใช้ <b style="color:#e67e22;">${pointsDeduct} แต้ม</b><br>เพื่อแลก <b>${customRewardName}</b>`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: '✅ ยืนยันแลก!',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#27ae60'
    }).then((result) => {
        if (result.isConfirmed) {
            Swal.fire({ title: 'กำลังตัดแต้ม...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            api.redeemPoints(currentMember.phone, pointsDeduct, customRewardName).then(function(res) {
                if (res.success) {
                    Swal.fire('แลกสำเร็จ!', res.message, 'success');
                    
                    // อัปเดตแต้มบนหน้าจอ
                    currentMember.points = res.newPoints;
                    document.getElementById("activeMPoints").innerText = res.newPoints;
                    
                    // เอาของรางวัลชื่อใหม่ลงตะกร้า ในราคา 0 บาท
                    cart.push({ name: "[แลกแต้ม] " + customRewardName, price: 0, unitPrice: 0, qty: 1, category: "ของรางวัล" });
                    updateCart();
                } else {
                    Swal.fire('ผิดพลาด', res.message, 'error');
                }
            });
        }
    });
}

// ==========================================
// 🎯 ระบบสแกนบาร์โค้ด (แก้ไขแล้ว)
// ==========================================
document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        let inputVal = this.value.trim();
        if(inputVal !== '') {
            // ค้นหาสินค้าจากบาร์โค้ด โดยใช้ตัวแปร allProducts ที่ถูกต้อง
            let foundIndex = allProducts.findIndex(p => String(p.barcode) === inputVal);
            
            if(foundIndex !== -1) {
                let foundProduct = allProducts[foundIndex];
                let isOutOfStock = (foundProduct.stock !== "" && foundProduct.stock <= 0);
                
                // โยนเข้าตะกร้าโดยใช้ Index ตามที่ระบบต้องการ
                addToCart(foundIndex, isOutOfStock);
                this.value = ''; // ล้างช่องว่างรอสแกนชิ้นต่อไป
                this.focus();    // ให้เคอร์เซอร์กลับมาที่เดิม
            } else {
                Swal.fire({
                    icon: 'error', 
                    title: 'ไม่พบสินค้า', 
                    text: 'ไม่มีบาร์โค้ดนี้ในระบบ หรือสินค้าอาจถูกปิดการขาย', 
                    timer: 1500
                });
                this.value = ''; // ล้างช่องค้นหา
            }
        }
    }
});

  if (currentStaff) {
    loadProducts();
    updateTabCount();
  }
